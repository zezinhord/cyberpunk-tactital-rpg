name: Nova Arcadia 3GB — Android asset-pack bridge QA
on:
  push:
    branches:
      - feature/nova-arcadia-3gb-final-assets
    paths:
      - .github/workflows/na-asset-pack-bridge-qa.yml
      - native/NovaAssetPacks.java
      - scripts/install-asset-pack-plugin.mjs
      - scripts/test-asset-packs-v20.mjs
      - src/game/assets/**
      - src/game/districts/DistrictInteriorScene.ts
      - src/screens/ExplorationScreen.tsx
      - src/components/AssetPackControls.tsx
      - src/components/DossierGallery.tsx
      - src/components/CharacterMenu.tsx
      - src/dossier-gallery.css
      - tools/build_3gb_asset_packs.py
      - tools/test_3gb_pack_builder.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-native-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Python image QA dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install -r tools/requirements-characters.txt
      - name: Verify manifest security and real 3GB release acceptance
        run: node --experimental-strip-types scripts/test-asset-packs-v20.mjs
      - name: Verify 7 offline pack archives with 224 disposable art fixtures
        run: python tools/test_3gb_pack_builder.py
      - name: Compile TypeScript without releasing incomplete game
        run: npx tsc -b
      - name: Produce temporary minimal web directory for native compile only
        run: |
          mkdir -p dist
          printf '<html><body>native bridge compile test only</body></html>' > dist/index.html
      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Inject verified native pack downloader
        run: node scripts/install-asset-pack-plugin.mjs
      - name: Compile native SHA, private storage and zip hardening with Android SDK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
      - name: Ensure production requires real signed content
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const s=readFileSync("src/game/assets/published-packs.ts","utf8"); if(!s.includes("=EMPTY_CATALOG")) process.exit(1)'
          echo "No 3GB release tag created, no dummy packs published."
