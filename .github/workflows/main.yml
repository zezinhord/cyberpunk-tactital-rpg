name: Build Cyberpunk Tactical RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/landscape-mobile-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar gerador de personagens
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar recursos de geração gráfica
        run: python -m pip install -r tools/requirements-characters.txt

      - name: Instalar dependencias
        run: npm install

      - name: Testar sistema de habilidades
        run: node --experimental-strip-types scripts/test-abilities.mjs

      - name: Testar colisões físicas e portas da Baixada
        run: node --experimental-strip-types scripts/test-baixada-collisions.mjs

      - name: Testar NPCs, dialogos e persistencia da campanha
        run: |
          node --experimental-strip-types scripts/test-npc-routines.mjs
          node --experimental-strip-types scripts/test-patio-dialogues.mjs
          node --experimental-strip-types scripts/test-story-v09.mjs
          node --experimental-strip-types scripts/test-world-location.mjs

      - name: Verificar audio e regras de classes
        run: |
          node --experimental-strip-types scripts/test-audio.mjs
          node --experimental-strip-types scripts/test-class-abilities.mjs

      - name: Validar planta, colisões e rotas da Baixada
        run: node --experimental-strip-types scripts/test-baixada-layout.mjs

      - name: Compilar aplicacao
        run: npm run build

      - name: Verificar os 12 spritesheets direcionais
        run: node scripts/test-character-sheets.mjs

      - name: Capturar screenshot real da Baixada em Chromium
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/capture-baixada-visual.mjs

      - name: Publicar captura visual da Baixada
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Baixada-Visual-QA-1600x720
          path: qa/
          if-no-files-found: ignore
          retention-days: 14

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar orientacao horizontal
        run: node scripts/lock-android-landscape.mjs

      - name: Ativar tela imersiva Android
        run: node scripts/enable-android-immersive.mjs

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Tactical-RPG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
