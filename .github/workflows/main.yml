name: Build Cyberpunk Tactical RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/landscape-mobile-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicacao
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar orientacao horizontal
        run: node scripts/lock-android-landscape.mjs

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Tactical-RPG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
