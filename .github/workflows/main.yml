name: Build Cyberpunk Tactical RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nova-arcadia-expansion-v080
      - feature/nova-arcadia-1gb-systems-v082
      - feature/nova-arcadia-1gb-expansion-v090
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

# Apenas o build mais recente da branch ativa pode promover o APK.
# Impede CI antigo terminar depois e substituir uma atualização nova.
concurrency:
  group: nova-arcadia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar gerador de personagens
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar recursos de geração gráfica
        run: python -m pip install -r tools/requirements-characters.txt

      - name: Instalar dependencias imutaveis
        run: npm ci --no-audit --no-fund

      - name: Verificar catálogo de direitos CC0 antes da compilação
        run: |
          python tools/import_cc0_music.py --check
          node --experimental-strip-types scripts/test-cc0-radio.mjs

      - name: Verificar contrato de identidade visual Nova Arcádia
        run: node .agents/skills/nova-arcadia-game-art-ui/scripts/check-visual-contract.mjs

      - name: Verificar toque alinhado com câmera suavizada
        run: node scripts/test-visual-camera-hit.mjs

      - name: Verificar TypeScript antes da geração pesada de recursos
        run: npx tsc -b

      - name: Testar sistema de habilidades
        run: node --experimental-strip-types scripts/test-abilities.mjs

      - name: Testar colisões físicas e portas da Baixada
        run: node --experimental-strip-types scripts/test-baixada-collisions.mjs

      - name: Testar cura na clinica e persistencia de Vida
        run: node --experimental-strip-types scripts/test-clinic-healing.mjs

      - name: Testar favores progressivos, carteira, honra e loja
        run: node --experimental-strip-types scripts/test-favors.mjs

      - name: Testar novas ocorrências urbanas, relações e backups
        run: node --experimental-strip-types scripts/test-urban-chronicles.mjs

      - name: Testar o arco pós-Circuito Fantasma, combates e decisões do Projeto Éden
        run: node --experimental-strip-types scripts/test-eden-echoes.mjs

      - name: Testar NPCs, dialogos e persistencia da campanha
        run: |
          node --experimental-strip-types scripts/test-npc-routines.mjs
          node --experimental-strip-types scripts/test-patio-dialogues.mjs
          node --experimental-strip-types scripts/test-story-v09.mjs
          node --experimental-strip-types scripts/test-world-location.mjs
          node --experimental-strip-types scripts/test-market-story.mjs
          node --experimental-strip-types scripts/test-semiopen-world.mjs

      - name: Verificar audio e regras de classes
        run: |
          node --experimental-strip-types scripts/test-audio.mjs
          node --experimental-strip-types scripts/test-class-abilities.mjs
          node --experimental-strip-types scripts/test-class-saves.mjs
          node --experimental-strip-types scripts/test-save-slots.mjs

      - name: Testar perfis gráficos e FPS Android
        run: node --experimental-strip-types scripts/test-performance.mjs

      - name: Testar prólogo cinematográfico e migração de salvamentos
        run: node --experimental-strip-types scripts/test-opening.mjs

      - name: Validar a interface narrativa cinematografica e seus gatilhos
        run: node scripts/test-narrative-ui.mjs

      - name: Validar sintaxe JavaScript enviada ao Chromium antes da compilacao
        run: node scripts/test-cdp-eval-syntax.mjs

      - name: Validar linha de tiro, cobertura, IA e movimento Android
        run: |
          node --experimental-strip-types scripts/test-tactics.mjs
          node --experimental-strip-types scripts/test-movement.mjs

      - name: Testar implantes, consumíveis e novos encontros Éden
        run: node --experimental-strip-types scripts/test-expansion-combat.mjs

      - name: Verificar campo SVG e retorno ao mapa após vitória
        run: node --experimental-strip-types scripts/test-battlefield-navigation.mjs

      - name: Reproduzir morte a 0 PV e validar evacuação, retentativa e salvamentos
        run: node --experimental-strip-types scripts/test-combat-defeat.mjs

      - name: Testar progressao, campanha e ondas de combate
        run: |
          node --experimental-strip-types scripts/test-progression.mjs
          node --experimental-strip-types scripts/test-field-test.mjs
          node --experimental-strip-types scripts/test-combat-waves.mjs

      - name: Testar fabricação, materiais e equipamentos industriais
        run: node --experimental-strip-types scripts/test-crafting.mjs

      - name: Testar Ferrugem, novo distrito industrial e campanha ramificada
        run: node --experimental-strip-types scripts/test-ferrugem.mjs

      - name: Validar identidade artística e acessibilidade dos cinco distritos
        run: node --experimental-strip-types scripts/test-district-art.mjs

      - name: Verificar oclusao dos predios e sprites dos guias
        run: node scripts/test-visual-depth.mjs

      - name: Testar cinco distritos, 35 missões e dez desfechos
        run: node --experimental-strip-types scripts/test-districts.mjs

      - name: Validar caches reais e rotas dos seis territórios
        run: node --experimental-strip-types scripts/test-world-cache.mjs

      - name: Testar os sete interiores autorais, corredores e 21 recompensas
        run: node --experimental-strip-types scripts/test-indoor-expansion.mjs

      - name: Testar os dois esgotos e checkpoints da investigação
        run: node --experimental-strip-types scripts/test-sewer-world.mjs

      - name: Validar planta, colisões e rotas da Baixada
        run: node --experimental-strip-types scripts/test-baixada-layout.mjs

      - name: Restaurar trilhas originais entre builds
        uses: actions/cache@v4
        with:
          path: public/assets/soundscapes
          key: nova-arcadia-original-score-v1-${{ hashFiles('tools/generate_soundscapes.py') }}

      # Cache de áudio é isolado por branch no GitHub. Reutilizamos as 56
      # composições produzidas e validadas no APK 0.7.9, preservando hashes
      # e a geração procedural como fallback quando o download não funciona.
      - name: Reutilizar 56 trilhas originais de build validada
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s public/assets/soundscapes/baixada/abertura.ogg ] &&
             [ -s public/assets/soundscapes/periferia/revelacao.ogg ] &&
             [ -s public/assets/soundscapes/catalog.json ]; then
            echo "Trilhas originais já restauradas do cache desta branch."
          else
            echo "Tentando recuperar somente os áudios da build Android 0.7.9 validada."
            if curl --connect-timeout 10 --max-time 120 --retry 2 -fsSL \
               -H "Authorization: Bearer ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14284261708/zip" \
               -o /tmp/nova-arcadia-v079-artifact.zip &&
               unzip -p /tmp/nova-arcadia-v079-artifact.zip app-debug.apk > /tmp/nova-arcadia-v079.apk &&
               python tools/recover_soundscapes_from_apk.py /tmp/nova-arcadia-v079.apk; then
              echo "Áudios restaurados sem síntese custosa; preservados no pacote final."
            else
              echo "Recuperação indisponível: o sintetizador local regenerará os arquivos faltantes."
            fi
          fi
          rm -f /tmp/nova-arcadia-v079-artifact.zip /tmp/nova-arcadia-v079.apk

      - name: Instalar e validar sintetizador de trilha original
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | grep 'libopus'

      - name: Restaurar ambientes urbanos originais entre compilações
        uses: actions/cache@v4
        with:
          path: public/assets/ambient
          key: nova-arcadia-ambience-v081-${{ hashFiles('tools/generate_urban_ambience.py') }}

      # Reaproveita 28 Ogg originais da CI #865 validada; cache do Actions
      # é isolado por branch, por isso fallback mantém o sintetizador original.
      - name: Recuperar ambiências verificadas da versão Android anterior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s public/assets/ambient/manifest.json ] && [ -s public/assets/ambient/periferia/alert.ogg ]; then
            echo "Ambiências restauradas do cache."
          else
            echo "Tentando reutilizar áudio original da APK Android 0.8.1 (#865)."
            if curl --connect-timeout 10 --max-time 180 --retry 2 -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14321498457/zip" -o /tmp/nova-v081-ambience.zip &&
               unzip -p /tmp/nova-v081-ambience.zip app-debug.apk > /tmp/nova-v081-ambience.apk &&
               python tools/recover_ambience_from_apk.py /tmp/nova-v081-ambience.apk; then
              echo "28 ambiências restauradas do APK íntegro; validação adicional após o build."
            else
              echo "Recuperação indisponível. Síntese original ocorrerá normalmente."
            fi
          fi
          rm -f /tmp/nova-v081-ambience.zip /tmp/nova-v081-ambience.apk

      - name: Produzir 28 ambiências ambientais originais para 7 distritos
        run: python tools/generate_urban_ambience.py

      - name: Verificar duração, originalidade e integração das ambiências
        run: node scripts/test-urban-ambience.mjs

      - name: Restaurar musicas CC0 licenciadas entre compilações
        uses: actions/cache@v4
        with:
          path: public/assets/music
          key: nova-arcadia-cc0-v1-${{ hashFiles('music/cc0-sources.json', 'tools/import_cc0_music.py') }}

      - name: Importar musicas reais CC0 para reproduzir sem internet
        run: python tools/import_cc0_music.py

      # Cache para mídia gerada apenas no runner: assets não entram no Git.
      - name: Restaurar 112 ambiências adaptativas do cache
        uses: actions/cache@v4
        with:
          path: public/assets/ambient-expanded
          key: nova-arcadia-v090-${{ hashFiles('tools/generate_city_ambiences.py') }}

      - name: Verificar pequena amostra do sintetizador original
        run: python tools/generate_city_ambiences.py --sample

      - name: Produzir 112 composições ambientais originais
        env:
          NA_AUDIO_WORKERS: 4
        run: python tools/generate_city_ambiences.py

      - name: Validar 112 gravações ambientais e URLs utilizadas
        run: node --experimental-strip-types scripts/test-expanded-ambience.mjs

      - name: Compilar aplicacao
        run: npm run build

      - name: Validar 56 trilhas originais e duração do conteúdo
        run: node --experimental-strip-types scripts/test-soundscapes.mjs

      - name: Verificar os 12 spritesheets direcionais
        run: node scripts/test-character-sheets.mjs

      - name: Verificar NPCs proprios 4 direcoes e atlas visual
        run: node scripts/test-npc-sheets.mjs

      - name: Testar acabamento da Baixada
        run: node scripts/test-baixada-art.mjs

      - name: Testar primeiro boot Android sem cache, Phaser ou WebGL
        run: node scripts/test-android-cold-boot.mjs

      - name: Capturar screenshot real da Baixada em Chromium
        if: github.event_name == 'push'
        # Falhas de UX ou erros em JS devem impedir uma entrega marcada
        # como validada. O bloco abaixo já repete falhas transitórias do CDP.
        run: |
          # O Chromium do runner pode encerrar antes de abrir a porta CDP.
          # Repetir o processo inteiro preserva a validação funcional e coleta
          # exceções reais caso a falha seja de aplicativo, não de startup.
          for attempt in 1 2 3; do
            echo "QA visual: tentativa $attempt/3"
            if node scripts/capture-baixada-visual.mjs; then
              exit 0
            fi
            sleep 3
          done
          echo "QA visual indisponível após três tentativas"
          exit 1

      - name: Publicar captura visual da Baixada
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Baixada-Visual-QA-1600x720
          path: qa/
          if-no-files-found: ignore
          retention-days: 14

      - name: Criar projeto Android
        if: github.event_name != 'pull_request'
        run: npx cap add android

      - name: Sincronizar Capacitor
        if: github.event_name != 'pull_request'
        run: npx cap sync android

      - name: Aplicar orientacao horizontal
        if: github.event_name != 'pull_request'
        run: node scripts/lock-android-landscape.mjs

      - name: Atualizar versao real no manifesto Android
        if: github.event_name != 'pull_request'
        run: node scripts/stamp-android-version.mjs

      - name: Ativar tela imersiva Android
        if: github.event_name != 'pull_request'
        run: node scripts/enable-android-immersive.mjs

      - name: Restaurar chave de assinatura Android da branch
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-arcadia-android-debug-key-v2

      - name: Criar chave Android de teste se nao estiver em cache
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ "$GITHUB_REF" = "refs/heads/feature/nova-arcadia-1gb-expansion-v090" ]; then
            test -s "$HOME/.android/debug.keystore" || {
              echo "ERRO: chave Android persistente ausente. Bloqueando nova assinatura incompatível." >&2
              exit 1
            }
          fi
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Nova Arcadia Debug,O=Nova Arcadia,C=BR"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Vincular certificado persistente ao Gradle
        if: github.event_name != 'pull_request'
        run: node scripts/force-android-signing.mjs

      - name: Gerar APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Confirmar manifesto Android real e progresso de versao
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          mkdir -p qa
          "$AAPT" dump badging "$APK" | tee qa/apk-badging.txt
          grep -Fq "name='com.cyberpunk.tacticalrpg'" qa/apk-badging.txt
          grep -Fq "versionCode='90002'" qa/apk-badging.txt
          grep -Fq "versionName='0.9.0-rc.2'" qa/apk-badging.txt
          echo "APK Android gerado: pacote, versionCode e versionName conferidos."


      - name: Validar marco de 1 GB e conteúdo REAL usado no APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python tools/audit_apk_content.py android/app/build/outputs/apk/debug/app-debug.apk
          BYTES="$(stat -c %s android/app/build/outputs/apk/debug/app-debug.apk)"
          echo "APK_BYTES=$BYTES"
          echo "MARCO_1_GB_BYTES=1000000000"
          {
            echo "## Nova Arcádia 0.9.0-rc.2 — marco de 1 GB auditado"
            echo "APK real: **$BYTES bytes**"
            echo "Meta atual: **1.000.000.000 bytes**"
            echo "Sem limite máximo: arquivos devem estar ligados ao jogo."
            echo "Manifestos verificaram 56 músicas, 28 ambientes originais e 112 ambientes novos"
            echo "e 29 folhas direcionais utilizadas em jogo (17 NPCs + 12 protagonistas)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validar assinatura real da APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p qa
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | tee qa/assinatura-debug.txt
          grep -q 'certificate SHA-256 digest' qa/assinatura-debug.txt
          grep -q 'CN=Nova Arcadia Debug' qa/assinatura-debug.txt
          if [ "$GITHUB_REF" = "refs/heads/feature/nova-arcadia-1gb-expansion-v090" ]; then
            EXPECTED="$(cat config/android-qa-v090-cert.sha256)"
            ACTUAL="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' qa/assinatura-debug.txt | head -n 1)"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERRO: certificado Android mudou. Atualização seria incompatível." >&2
              exit 1
            fi
            echo "Assinatura 0.9 estável verificada: $ACTUAL"
          fi
          if [ "$GITHUB_REF" = "refs/heads/feature/landscape-mobile-v1" ]; then
            ACTUAL="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' qa/assinatura-debug.txt | head -n 1)"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERRO: assinatura mudou. Não distribua APK incompatível. Esperado: $EXPECTED; atual: $ACTUAL" >&2
              exit 1
            fi
            echo "Certificado Android estável confirmado: $ACTUAL"
          fi

      - name: Publicar identidade da assinatura
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Assinatura-Android-QA
          path: qa/assinatura-debug.txt
          retention-days: 30

      - name: Disponibilizar APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Tactical-RPG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14


      # Pré-lançamento isolado: APK puro sem afetar o canal permanente v080.
      - name: Publicar o APK 0.9.0-rc.2 de QA para download direto
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-arcadia-1gb-expansion-v090'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-arcadia-v090-rc2-qa"
          ASSET="NovaArcadia-0.9.0-rc.2-QA.apk"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c %s "$APK")" -ge 1000000000
          cp "$APK" "$ASSET"
          SHA256="$(sha256sum "$ASSET" | cut -d " " -f 1)"
          SIZE="$(stat -c %s "$ASSET")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nova Arcádia 0.9.0-rc.2 — QA Android" --notes "Candidata experimental; testes físicos pendentes. Exporte backup antes de instalar." --prerelease
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Nova Arcádia 0.9.0-rc.2 — QA Android" --notes "APK direto de teste, sem ZIP. Build #$GITHUB_RUN_NUMBER, commit $GITHUB_SHA, $SIZE bytes, SHA-256 $SHA256. Validar Galaxy A07 e Redmi Note 12S antes de publicação. Preservar saves." --prerelease
          echo "APK direto QA: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"


      # Variante INTEGRAL (mais de 1GB) usa ID separado e preserva a antiga.
      # As 112 ambiências estendidas são obrigatórias e devem chegar ao APK.
      - name: Preparar APK COMPLETO 1GB Android independente
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-arcadia-1gb-expansion-v090'
        run: |
          set -euo pipefail
          test -s dist/assets/ambient-expanded/manifest.json
          test "$(find dist/assets/ambient-expanded -type f -name '*.ogg' | wc -l)" -eq 112
          npx cap sync android
          node scripts/prepare-android-compat.mjs
          (cd android && ./gradlew :app:assembleDebug --rerun-tasks)
          mkdir -p qa
          cp android/app/build/outputs/apk/debug/app-debug.apk qa/NovaArcadia-0.9.0-rc.2-Full-1GB-QA.apk

      - name: Auditar APK INTEGRAL, assinatura e tamanho acima de 1GB
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-arcadia-1gb-expansion-v090'
        run: |
          set -euo pipefail
          APK="qa/NovaArcadia-0.9.0-rc.2-Full-1GB-QA.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" > qa/compat-badging.txt
          grep -Fq "name='com.cyberpunk.tacticalrpg.qa'" qa/compat-badging.txt
          grep -Fq "versionCode='90002'" qa/compat-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > qa/compat-signature.txt
          grep -Fq "$(cat config/android-qa-v090-cert.sha256)" qa/compat-signature.txt
          python tools/audit_apk_content.py "$APK"

      - name: Publicar APK COMPLETO 1GB para instalacao lado a lado
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-arcadia-1gb-expansion-v090'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-arcadia-v090-1gb-parallel-qa"
          ASSET="NovaArcadia-0.9.0-rc.2-Full-1GB-QA.apk"
          APK="qa/$ASSET"
          SIZE="$(stat -c %s "$APK")"
          SHA="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nova Arcádia 0.9.0 — Completo 1GB (instala ao lado)" \
              --notes "APK INTEGRAL acima de 1 GB, com 112 ambientes sonoros adicionais. Pacote Android separado: não remove a instalação antiga. Salvos não são transferidos automaticamente; exporte backup antes de apagar qualquer app." \
              --prerelease
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Nova Arcádia 0.9.0 — Completo 1GB (instala ao lado)" \
            --notes "APK INTEGRAL >1GB com 112 ambientes adicionais presentes; pacote Android independente com.cyberpunk.tacticalrpg.qa; $SIZE bytes; SHA-256 $SHA; commit $GITHUB_SHA. Preserva a instalação e os dados do app antigo. Para recuperar personagens, exporte e importe backup manualmente quando possível." --prerelease
          echo "APK COMPLETO 1GB instalado em paralelo: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar somente o APK atual no canal permanente de testes
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-arcadia-expansion-v080'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-arcadia-android-atual"
          ASSET="NovaArcadia-Android-atual.apk"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(node -p 'require("./package.json").version')"
          test -s "$APK"
          test "$(stat -c %s "$APK")" -ge 250000000
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > qa/certificado-canal-atual.txt
          # Apenas a assinatura da linha atual poderá atualizar este APK.
          grep -Fiq "cb8a4e8c5c17d326e7ad0a08bbb90cd50eaf2d4ecfda59bf300784361eb44eb6" qa/certificado-canal-atual.txt
          test "$(stat -c %s "$APK")" -ge 1000000000
          cp "$APK" "$ASSET"
          SHA256="$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target feature/nova-arcadia-expansion-v080 \
              --title "Nova Arcádia — APK Android atual" \
              --notes "Canal oficial de testes Android: um único APK acumulativo. Testes em aparelhos físicos ainda pendentes." \
              --prerelease
          fi
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Nova Arcádia — Android $VERSION (atual)" \
            --notes "APENAS UMA VERSÃO RECOMENDADA PARA TESTES: $VERSION. APK assinado na linha de desenvolvimento atual, acumulando todos os conteúdos anteriores. Workflow: #$GITHUB_RUN_NUMBER; commit: $GITHUB_SHA; SHA-256 do APK: $SHA256. Instale por cima da versão atual após exportar o backup do personagem. Não usar builds históricos de outras branches; não desinstalar sem backup. Teste físico de estabilidade ainda pendente." \
            --prerelease
          {
            echo "## APK ÚNICO ATUAL — Nova Arcádia $VERSION"
            echo "Link permanente: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
            echo "SHA-256: \`$SHA256\`"
            echo "Pacote Android auditado e assinatura da linha atual conferida."
          } >> "$GITHUB_STEP_SUMMARY"
