name: Tenebria 3D - APK Android
on:
  workflow_dispatch:
  push:
    branches:
      - tenebria-3d-android
  pull_request:
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    name: Validar e compilar APK arm64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python para gerar recursos originais
        run: |
          apt-get update -qq
          apt-get install -y python3 >/dev/null
      - name: Gerar icones e audio originais
        run: python3 tools/gen_assets.py
      - name: Disponibilizar templates e configuracao Android ao runner
        run: |
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config/godot"
          ln -s /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          cp /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/editor_settings-4.4.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
      - name: Importar os recursos Godot
        run: godot --headless --editor --path . --quit
      - name: Testar a cena principal por 90 quadros
        run: |
          godot --headless --path . --quit-after 90 > /tmp/tenebria-smoke.log 2>&1
          cat /tmp/tenebria-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Failed to load script' /tmp/tenebria-smoke.log; then
            exit 1
          fi
      - name: Exportar APK instalavel (debug)
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Tenebria-Ecos-de-Ruturam.apk
      - name: Validar tamanho maximo de 2 GB
        run: |
          test -s build/Tenebria-Ecos-de-Ruturam.apk
          stat -c 'Tamanho do APK: %s bytes' build/Tenebria-Ecos-de-Ruturam.apk
          test "$(stat -c %s build/Tenebria-Ecos-de-Ruturam.apk)" -le 2000000000
      - name: Publicar APK nos artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: tenebria-3d-android-debug-apk
          path: build/Tenebria-Ecos-de-Ruturam.apk
          if-no-files-found: error
          retention-days: 30
