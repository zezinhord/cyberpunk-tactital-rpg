name: Nova Arcadia Gameplay CI
on:
  push:
    branches:
      - feature/nova-arcadia-gameplay-depth-v091
      - feature/nova-arcadia-finalization-v100-rc
      - feature/nova-arcadia-cisma-eden-v20-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias sem geracao pesada de audios
        run: npm ci --no-audit --no-fund
      - name: Validar tipos e componentes
        run: npx tsc -b
      - name: Testar taticas e combate
        run: node --experimental-strip-types scripts/test-tactics.mjs
      - name: Testar ocorrencias e consequencias persistentes
        run: node --experimental-strip-types scripts/test-urban-chronicles.mjs
      - name: Verificar caminhos, colisões e missões nos cinco distritos
        run: node --experimental-strip-types scripts/test-districts.mjs
      - name: Testar classes e habilidades
        run: node --experimental-strip-types scripts/test-class-abilities.mjs
      - name: Testar finais, epilogos e salvamento do Projeto Eden
        run: |
          node --experimental-strip-types scripts/test-eden-echoes.mjs
          node --experimental-strip-types scripts/test-eden-governance.mjs
      - name: Testar o Cisma de Eden 2.0, oito etapas e tres caminhos
        run: node --experimental-strip-types scripts/test-cisma-v20.mjs
      - name: Testar Atos II-IV, combate e finais completos da campanha 2.0
        run: node --experimental-strip-types scripts/test-cisma-operations.mjs
      - name: Testar 35 mapas internos e 105 recursos reais
        run: node --experimental-strip-types scripts/test-indoor-expansion.mjs
      - name: Testar cyberware 2.0 e integridade dos custos de instalação
        run: node --experimental-strip-types scripts/test-cyberware-v20.mjs
      - name: Testar quatro aliados e apoio tático no motor de combate
        run: node --experimental-strip-types scripts/test-companions-v20.mjs
      - name: Testar rotas de infiltracao e efeito real nos tres encontros 2.0
        run: node --experimental-strip-types scripts/test-stealth-v20.mjs
      - name: Testar backups e eliminacao de slots
        run: node --experimental-strip-types scripts/test-save-slots.mjs
      - name: Testar as 66 combinacoes de classe e origem
        run: node --experimental-strip-types scripts/test-class-saves.mjs
      - name: Testar fabricacao e equipamentos
        run: node --experimental-strip-types scripts/test-crafting.mjs
      - name: Testar derrota, cura e retorno seguro ao combate
        run: node --experimental-strip-types scripts/test-combat-defeat.mjs
      - name: Validar contrato visual
        run: node .agents/skills/nova-arcadia-game-art-ui/scripts/check-visual-contract.mjs
