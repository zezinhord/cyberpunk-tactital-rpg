name: Nova Arcadia 2.0 — real authored art production and size audit

on:
  push:
    branches:
      - feature/nova-arcadia-3gb-final-assets
    paths:
      - .github/workflows/na-original-content-production.yml
      - tools/produce_district_archives.py
      - tools/produce_story_cinematics.py
      - tools/produce_tactical_simulations.py
      - tools/produce_perimeter_routes.py
      - tools/test_perimeter_routes.py
      - tools/produce_vigil_escorts.py
      - tools/test_vigil_escorts.py
      - tools/produce_shelter_network.py
      - tools/test_shelter_network.py
      - src/game/story/shelter-network.ts
      - src/game/story/vigil-escorts.ts
      - tools/test_tactical_simulations.py
      - tools/test_story_cinematics.py
      - tools/generate_v20_illustrations.py
      - tools/generate_council_enemy_art.py
      - tools/test_council_enemy_art.py
      - tools/na_milestones.py
      - tools/test_na_milestones.py
      - tools/build_3gb_asset_packs.py
      - src/game/districts/expansion-interiors.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-arcadia-authorial-art-production
  cancel-in-progress: true

jobs:
  generate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact expansion branch
        uses: actions/checkout@v4
      - name: Python 3.12 and artistic libraries
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Pillow
        run: pip install -r tools/requirements-characters.txt
      - name: Draw real physical room murals and three evidence props
        run: python tools/generate_v20_illustrations.py
      - name: Render all 16 real antagonist atlases before pack audit
        run: |
          python tools/generate_council_enemy_art.py
          python tools/test_council_enemy_art.py
      - name: Produce twelve original graphical investigative documents per room
        run: python tools/produce_district_archives.py --source resourcepacks/source
      - name: Produce 448 zoomable original cinematic illustrations, sixteen per interior
        run: |
          python tools/produce_story_cinematics.py --source resourcepacks/source
          python tools/test_story_cinematics.py --source resourcepacks/source --full
      - name: Render 672 original playable isometric scenarios for 28 interiors
        run: |
          python tools/produce_tactical_simulations.py --source resourcepacks/source
          python tools/test_tactical_simulations.py --source resourcepacks/source --full
      - name: Render 560 real patrol floorplan viewpoints for 28 active mission maps
        run: |
          python tools/produce_perimeter_routes.py --source resourcepacks/source
          python tools/test_perimeter_routes.py --source resourcepacks/source --full
      - name: Draw 448 active four-stage civilian rescue frames in all 28 real interior sectors
        run: |
          python tools/produce_vigil_escorts.py --source resourcepacks/source
          python tools/test_vigil_escorts.py --source resourcepacks/source --full
      - name: Produce 560 map-specific scenes for 140 playable post-Vigília Refúgio decisions
        run: |
          python tools/produce_shelter_network.py --source resourcepacks/source
          python tools/test_shelter_network.py --source resourcepacks/source --full
      - name: Audit 7 district manifests and build 7 original ZIP packs
        run: |
          set -euo pipefail
          python tools/build_3gb_asset_packs.py \
            --source resourcepacks/source --output resourcepacks/release \
            --test-only-skip-size-gate
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path('resourcepacks/release/manifest.json').read_text())
          assert len(cat['packs'])==7
          assert all(p['locationCount']==4 for p in cat['packs'])
          assert all(p['artworkCount']==448 for p in cat['packs'])
          assert sum(p['artworkCount'] for p in cat['packs'])==3136
          sprite=json.loads(Path('public/assets/council-enemies/catalog.json').read_text())
          assert sprite['artworks']==16 and sprite['frames']==512
          # The extra original enemy sprites count in production but NOT in
          # the audited base APK total until a signed build includes them.
          total=1_143_503_198+cat['totalBytes']
          report=dict(audited=True,artworks=3136,cinematic_scenes=448,
                      tactical_simulation_frames=672,simulation_decisions=168,
                      perimeter_patrol_frames=560,perimeter_objectives=140,
                      vigil_escort_frames=448,evacuee_groups=112,moving_sentries=84,
                      shelter_relief_frames=560,shelter_checkpoints=140,
                      enemy_sprites=16,
                      enemy_animation_frames=512,
                      generated_enemy_bytes=sprite['totalBytes'],interactive_rooms=28,
                      documents=336,total_bytes=total,
                      first_300mb_observed=total>=1_474_082_151,
                      second_300mb_observed=total>=1_775_365_848,
                      third_300mb_observed=total>=2_074_082_151,
                      fourth_300mb_observed=total>=2_374_082_151,
                      fifth_300mb_observed=total>=2_674_082_151,
                      target_bytes=3_000_000_000,
                      still_missing_bytes=max(0,3_000_000_000-total),
                      ready_for_final_release=total>=3_000_000_000)
          Path('resourcepacks/release/production-report.json').write_text(
            json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Calculate real sequential 300 MB release gates
        run: |
          python tools/test_na_milestones.py
          TOTAL="$(python -c "import json; print(json.load(open('resourcepacks/release/production-report.json'))['total_bytes'])")"
          python tools/na_milestones.py --total-bytes "$TOTAL" --signed-apk --audited-packs --output resourcepacks/release/milestones.json
      - name: Preserve actual audit and all seven inspectable art packs
        uses: actions/upload-artifact@v4
        with:
          name: NovaArcadia-2.0-Art-Production-Audit-NOT-FINAL
          path: |
            resourcepacks/release/NA20-*.zip
            resourcepacks/release/manifest.json
            resourcepacks/release/SHA256SUMS.txt
            resourcepacks/release/production-report.json
            resourcepacks/release/milestones.json
            public/assets/council-enemies/*.png
            public/assets/council-enemies/catalog.json
          retention-days: 5
          if-no-files-found: error
      - name: State the final 3GB release requirement accurately
        run: |
          python - <<'PY'
          import json
          x=json.load(open('resourcepacks/release/production-report.json'))
          m=json.load(open('resourcepacks/release/milestones.json'))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('# Nova Arcádia — arte autoral produzida\n')
            out.write(f"**{x['artworks']}** arquivos originais em 28 salas; "
                      f"{x['documents']} pranchas e "
                      f"{x['cinematic_scenes']} quadros cinematográficos e "
                      f"{x['tactical_simulation_frames']} cenas de operações táticas e "
                      f"{x['perimeter_patrol_frames']} plantas navegáveis para "
                      f"{x['perimeter_objectives']} objetivos de patrulha, "
                      f"{x['vigil_escort_frames']} quadros de escolta para "
                      f"{x['evacuee_groups']} grupos civis protegidos e "
                      f"{x['moving_sentries']} sentinelas móveis e "
                      f"{x['shelter_relief_frames']} quadros de Refúgio em "
                      f"{x['shelter_checkpoints']} postos civis.\n\n")
            out.write(f"Novos sprites: {x['enemy_sprites']} atlases, "
                      f"{x['enemy_animation_frames']} poses/direções, "
                      f"{x['generated_enemy_bytes']:,} bytes de arte original. "
                      "Esses bytes só serão contabilizados na meta quando "
                      "a nova APK assinada for gerada.\n\n")
            out.write(f"Bytes auditados (APK RC4 + pacotes): **{x['total_bytes']:,}**.\n\n")
            out.write(f"Marcos de +300 MB concluídos após a linha inicial: "
                      f"**{m['verifiedMilestones']}**. "
                      f"Próxima meta: **{m['nextTargetBytes']:,}** bytes. "
                      f"Restam **{m['remainingToNextBytes']:,}** bytes.\n\n")
            if x['still_missing_bytes']:
              out.write(f"**NÃO FINAL**: faltam {x['still_missing_bytes']:,} bytes "
                        "de recursos originais para a distribuição de 3 GB.\n")
            else:
              out.write("3 GB atingidos em bytes originais; a homologação Android "
                        "e a publicação final ainda exigem o workflow definitivo.\n")
          PY
