name: Nova Arcadia RC18 — three integrated stages, full Phaser Android, 3.26GB QA201 APK

# Signed QA201 build with all original content mandatory and one-click setup; still QA prerelease.
# Runs in the existing QA201 signing cache scope; only the SOURCE checkout
# points to the fully reviewed RC18 commit, ensuring signed upgrade compatibility.
on:
  push:
    branches:
      - feature/nova-arcadia-3gb-final-assets
    paths:
      - .github/workflows/na-rc18-qa201-full-game-apk.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nova-arcadia-v200-single-3gb-qa201-rc18
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout pinned RC18 game source within original QA201 signing cache scope
        uses: actions/checkout@v4
        with:
          ref: db79b3d737884c350b8ec1ddedcfceb2a78ce42e
      - name: Verify source includes the latest tactical maps and cinematics and is not an older detached commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "db79b3d737884c350b8ec1ddedcfceb2a78ce42e"
          test -s src/game/combat/tactical-maps.ts
          test -s src/game/story/cinematic-engine.ts
          test -s src/game/story/cinematic-battles.ts
          test -s src/components/OpeningCutscene.tsx
          test -s scripts/test-battlefield-redesign-v20.mjs
          test -s scripts/test-cinematics-v20.mjs
          echo "RC18 SOURCE SHA (pinned): db79b3d737884c350b8ec1ddedcfceb2a78ce42e" >> "$GITHUB_STEP_SUMMARY"
          echo "QA201 SIGNING CACHE WORKFLOW REF: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r tools/requirements-characters.txt
      - name: Refuse version drift, preserve signed QA201 upgrade identity
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          if(pkg.version!=="2.0.0-rc.18"||lock.version!==pkg.version||
             lock.packages[""].version!==pkg.version)
            throw new Error("RC18 version mismatch. Refusing unsigned/incorrect downgrade");
          JS
      - name: Generate physical room tiles for the new Android client
        run: python tools/generate_v20_illustrations.py
      - name: Verify mandatory installation and all 3808 original art invariants
        run: node --experimental-strip-types scripts/test-integrated-game-install-v20.mjs
      - name: Preflight all new campaigns before expensive art transfer
        run: |
          npx tsc -b
          node --experimental-strip-types scripts/test-shelter-network-v20.mjs
          node --experimental-strip-types scripts/test-nexus-eden-v20.mjs
          node --experimental-strip-types scripts/test-integrated-game-install-v20.mjs
          node --experimental-strip-types scripts/test-asset-packs-v20.mjs
          python tools/test_3gb_pack_builder.py
          node --experimental-strip-types scripts/test-rc18-stage1.mjs
          node --experimental-strip-types scripts/test-tactical-viewport-rc18.mjs
          node --experimental-strip-types scripts/test-district-citizens-rc18.mjs
          node --experimental-strip-types scripts/test-rc18-stage3.mjs
          node --experimental-strip-types scripts/test-crafting.mjs
          node --experimental-strip-types scripts/test-full-phaser-android.mjs
          node --experimental-strip-types scripts/test-battlefield-redesign-v20.mjs
          node --experimental-strip-types scripts/test-cinematics-v20.mjs
          node --experimental-strip-types scripts/test-opening.mjs
          node --experimental-strip-types scripts/test-narrative-ui.mjs
          node --experimental-strip-types scripts/test-patio-dialogues.mjs
      - name: Download all seven signed RC11 district art ZIPs (exact bytes, no rerender)
        uses: actions/download-artifact@v4
        with:
          pattern: NovaArcadia-RC11-3GB-Pack-*
          merge-multiple: true
          run-id: 44942021088
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: resourcepacks/release
      - name: Download RC11 signed SHA256 manifest and Android size report
        uses: actions/download-artifact@v4
        with:
          name: NovaArcadia-RC11-3GB-SHA256-Manifest-Reports
          run-id: 44942021088
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: resourcepacks/release
      - name: Refuse unverified prior content, missing ZIPs or non-3GB bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("resourcepacks/release")
          expected={"NA20-"+d+".zip" for d in (
           "baixada","ferrugem","aurea","subsolo","setor-zero","prisma","periferia")}
          assert {f.name for f in root.glob("NA20-*.zip")}==expected
          receipt=json.loads((root/"qa-3000-signed-report.json").read_text())
          assert receipt["totalBytes"]>=3_000_000_000 and receipt["final3GbReached"]
          assert (root/"SHA256SUMS.txt").is_file()
          print("Only authenticated previously signed RC11 3GB artwork accepted.")
          PY
      - name: Independently verify 3808 original drawings and all seven ZIP signatures for definitive gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path('resourcepacks/release')
          assert len(list(root.glob('NA20-*.zip')))==7,"Original art ZIPs not generated"
          manifest=root/'manifest.json'
          cat=json.loads(manifest.read_text(encoding='utf8'))
          assert cat['tag']=='nova-arcadia-v200-final-3gb-assets'
          assert len(cat['packs'])==7
          actual=0
          all_sha=set()
          for p in cat['packs']:
            archive=root/p['file']
            assert archive.is_file()
            size=archive.stat().st_size
            assert size==p['compressedBytes']
            digest=hashlib.sha256()
            with archive.open('rb') as reader:
              for buf in iter(lambda:reader.read(1024*1024),b''):
                digest.update(buf)
            assert digest.hexdigest()==p['sha256'],p['id']
            assert p['artworkCount']==544 and p['locationCount']==4
            assets=p['assets']
            assert len(assets)==544
            assert sum(x['kind']=='evac' for x in assets)==64
            assert sum(x['kind']=='shelter' for x in assets)==80
            assert sum(x['kind']=='nexus' for x in assets)==96
            assert sum(x['kind']=='route' for x in assets)==80
            assert sum(x['kind']=='spritesheet' for x in assets)==96
            assert sum(x['kind']=='cutscene' for x in assets)==64
            assert sum(x['kind']=='dossier' for x in assets)==48
            allowed={x['path'] for x in assets}
            assert len(allowed)==544
            with zipfile.ZipFile(archive) as container:
              assert set(container.namelist())==allowed
              assert len(container.namelist())==544
              expanded=0
              for member in assets:
                with container.open(member['path']) as source:
                  checksum=hashlib.sha256()
                  chunks=iter(lambda:source.read(1024*1024),b'')
                  for buf in chunks:
                    expanded+=len(buf)
                    checksum.update(buf)
                  assert checksum.hexdigest()==member['sha256'],member['path']
                assert member['sha256'] not in all_sha,'Duplicated art in ZIP'
                all_sha.add(member['sha256'])
              assert expanded==p['uncompressedBytes']
            actual+=size
          assert actual==cat['totalBytes']
          assert actual+1_143_503_198>=3_000_000_000
          cat['tag']='nova-arcadia-v200-final-3gb-assets'
          manifest.write_text(json.dumps(cat,ensure_ascii=False,indent=2)+'\n',
                              encoding='utf8')
          target=Path('src/game/assets/published-packs.ts')
          target.write_text('import type {PackCatalog} from "./pack-catalog.ts";\n'
             '/** Complete, audited 3GB content catalog; Android QA201 signed release still gated. */\n'
             'export const FINAL_ASSET_CATALOG:PackCatalog='+
             json.dumps(cat,ensure_ascii=False,indent=2)+';\n',encoding='utf8')
          print(f'PRE-SIGNATURE ART CHECK PASSED: {len(all_sha)} unique resources, '
                f'{actual:,} verified ZIP bytes; produced in THIS signed workflow.')
          PY
      - name: Validate all 28 Refúgio and 28 Nexo missions, 308 checkpoints and legacy story campaigns
        run: |
          set -euo pipefail
          npx tsc -b
          node --experimental-strip-types scripts/test-asset-packs-v20.mjs
          node --experimental-strip-types scripts/test-tactics.mjs
          node --experimental-strip-types scripts/test-battlefield-navigation.mjs
          node --experimental-strip-types scripts/test-mission-waypoint.mjs
          node --experimental-strip-types scripts/test-progression.mjs
          node --experimental-strip-types scripts/test-class-abilities.mjs
          node --experimental-strip-types scripts/test-progression-audit.mjs
          node --experimental-strip-types scripts/test-multiclass.mjs
          node --experimental-strip-types scripts/test-ai-tactical.mjs
          node --experimental-strip-types scripts/test-ai-world.mjs
          node --experimental-strip-types scripts/test-ai-combat-resources.mjs
          node --experimental-strip-types scripts/test-market-story.mjs
          node --experimental-strip-types scripts/test-cisma-v20.mjs
          node --experimental-strip-types scripts/test-cisma-operations.mjs
          node --experimental-strip-types scripts/test-inner-contracts-v20.mjs
          node --experimental-strip-types scripts/test-forensic-cases-v20.mjs
          node --experimental-strip-types scripts/test-council-defenses-v20.mjs
          node --experimental-strip-types scripts/test-recovery-network-v20.mjs
          node --experimental-strip-types scripts/test-recovery-calibrations-v20.mjs
          node --experimental-strip-types scripts/test-field-simulations-v20.mjs
          node --experimental-strip-types scripts/test-perimeter-routes-v20.mjs
          node --experimental-strip-types scripts/test-vigil-escorts-v20.mjs
          node --experimental-strip-types scripts/test-shelter-network-v20.mjs
          node --experimental-strip-types scripts/test-nexus-eden-v20.mjs
          node --experimental-strip-types scripts/test-council-tactical-maps-v20.mjs
          node --experimental-strip-types scripts/test-battlefield-redesign-v20.mjs
          node --experimental-strip-types scripts/test-cinematics-v20.mjs
          node --experimental-strip-types scripts/test-siege-terminals-v20.mjs
          node --experimental-strip-types scripts/test-save-slots.mjs
          node --experimental-strip-types scripts/test-companions-v20.mjs
          node --experimental-strip-types scripts/test-stealth-v20.mjs
          node --experimental-strip-types scripts/test-movement.mjs
          node --experimental-strip-types scripts/test-baixada-collisions.mjs
          node scripts/test-baixada-art.mjs
          node --experimental-strip-types scripts/test-performance.mjs
      - name: Install ffprobe for verification of original sound archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Restore verified original 1GB media without duplicating unused data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/nova-baseline"
          gh release download nova-arcadia-v091-gameplay-full-qa             --repo "$GITHUB_REPOSITORY"             --pattern "NovaArcadia-0.9.1-rc.1-Full-1GB-QA.apk"             --dir "$RUNNER_TEMP/nova-baseline"
          ORIGINAL="$RUNNER_TEMP/nova-baseline/NovaArcadia-0.9.1-rc.1-Full-1GB-QA.apk"
          test "$(stat -c %s "$ORIGINAL")" -eq 1143065746
          printf '%s  %s\n'             "af25764cb4a4f41b3b2677a7503230dafbaf026f551770125d721e41ad1c9915"             "$ORIGINAL" | sha256sum -c -
          python tools/restore_media_from_apk.py "$ORIGINAL"
          rm -f "$ORIGINAL"
      - name: Check trusted Android downloader, offline fallback and private installation
        run: |
          python - <<'PY'
          from pathlib import Path
          java=Path("native/NovaAssetPacks.java").read_text()
          client=Path("src/game/assets/native-pack-manager.ts").read_text()
          screen=Path("src/components/AssetPackControls.tsx").read_text()
          assert "@ActivityCallback" in java and "ACTION_OPEN_DOCUMENT" in java
          assert java.count("unpackVerifiedArchive(")==4
          assert "RELEASE_FIFTH.equals(tag)" in java
          assert "importDistrictPack" in client and "importLocal" in client
          gate=Path("src/components/GameInstallationGate.tsx").read_text()
          menu=Path("src/components/CharacterMenu.tsx").read_text()
          immersive=Path("scripts/enable-android-immersive.mjs").read_text()
          injector=Path("scripts/install-asset-pack-plugin.mjs").read_text()
          assert "else void prepareFullGame(latest)" in gate
          assert "const verified=initial??await readInstalled()" in gate
          assert "installEmbeddedDistrict(id,event" in gate
          assert "integratedApkStatus()" in gate
          assert "phase===\"failed\"" in gate
          assert "Arquivos do jogo" not in menu and "Conteúdo extra" not in menu
          assert "assetpacks" not in menu
          assert "GameInstallationGate" in Path("src/main.tsx").read_text()
          assert "FLAG_FULLSCREEN" in immersive and "onPostResume()" in immersive
          assert "writeFileSync(main,patched" in injector
          print("MANDATORY_BOOT_AND_FULLSCREEN_SOURCE_QA_PASS: auto setup, no optional tab, native hooks preserved.")
          PY
      - name: Ensure native downloader accepts all signed pack asset families
        run: |
          python - <<'PY'
          from pathlib import Path
          java=Path('native/NovaAssetPacks.java').read_text()
          for kind in ("murals","props","dossiers","cutscenes","spritesheets",
                       "routes","evacs","shelters","nexus"):
              assert java.count(kind)>=2,("Native pack reader does not allow "+kind)
          print("Native ZIP and asset resolvers cover all nine original content families.")
          PY
      - name: Verify original sound and ambience
        run: |
          node --experimental-strip-types scripts/test-expanded-ambience.mjs
          node scripts/test-urban-ambience.mjs
          node --experimental-strip-types scripts/test-soundscapes.mjs
      - name: Build web assets and mobile app
        run: |
          python tools/generate_council_enemy_art.py
          python tools/generate_character_sprites.py
          npx vite build
          node scripts/test-v20-illustrations.mjs
          node scripts/test-android-cold-boot.mjs
          npx cap add android
          npx cap sync android
          node scripts/lock-android-landscape.mjs
          node scripts/stamp-android-version.mjs
          node scripts/enable-android-immersive.mjs
          node scripts/install-asset-pack-plugin.mjs
      - name: Recover the SAME QA201 keystore used by the 1.475GB milestone
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-arcadia-v201-1474-signing-v1
      - name: Refuse a newly signed APK that cannot upgrade QA201 safely
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          echo "Old QA201 signing identity not available; refusing to strand player saves." >&2
          exit 1
      - name: Sign Android in-place upgrade with preserved QA201 identity
        run: |
          set -euo pipefail
          test -s ~/.android/debug.keystore
          echo "NA_QA_VARIANT=v201" >> "$GITHUB_ENV"
          echo "NA_PACKAGE=com.cyberpunk.tacticalrpg.qa201" >> "$GITHUB_ENV"
          node scripts/force-android-signing.mjs
          NA_QA_VARIANT=v201 node scripts/prepare-android-compat.mjs
      - name: Build ONE APK with all seven verified original archives physically inside it
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          catalog=json.loads(Path("resourcepacks/release/manifest.json").read_text())
          assert len(catalog["packs"])==7
          out=Path("android/app/src/main/assets/na-game")
          out.mkdir(parents=True,exist_ok=True)
          for p in catalog["packs"]:
            source=Path("resourcepacks/release")/p["file"]
            dest=out/p["file"]
            assert source.is_file() and source.stat().st_size==p["compressedBytes"]
            # Hardlink prevents duplicating the 2.11GB while Gradle stages assets.
            os.link(source,dest)
            print("BUNDLED IN APK:",dest,p["compressedBytes"])
          assert len(list(out.glob("NA20-*.zip")))==7
          PY
          cat >> android/app/build.gradle <<'GRADLE'

          // Store the already-compressed original district ZIPs without a second layer.
          android {
              androidResources {
                  noCompress += ['zip']
              }
          }
          GRADLE
          df -h .
      - name: Assemble signed single-file APK with the complete 3GB game already bundled
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Large CI runs can briefly hit Maven Central HTTP 429. Retry only
          # transient upstream rate limiting or connection errors; actual
          # Gradle compilation failures must still stop the release.
          for attempt in 1 2 3 4; do
            echo "Nova Arcadia Gradle assembly attempt $attempt/4"
            if ./gradlew assembleDebug --max-workers=2 --no-daemon 2>&1 |
              tee "$RUNNER_TEMP/na-rc18-gradle.log"; then
              exit 0
            fi
            if ! grep -Eiq 'status code (429|502|503|504)|Too Many Requests|Read timed out|Connect timed out|Connection reset' "$RUNNER_TEMP/na-rc18-gradle.log"; then
              echo "::error::Gradle compilation failure is not transient; refusing to retry or publish."
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Gradle dependency repositories remained unavailable after four attempts."
              exit 1
            fi
            delay=$((attempt * 35))
            echo "::warning::Transient Gradle dependency outage (HTTP 429/5xx); retrying in $delay seconds."
            sleep "$delay"
          done
      - name: Verify the SIGNED APK itself exceeds 3GB and embeds all seven exact ZIPs
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p qa
          python tools/audit_apk_content.py "$APK"
          python - <<'PY'
          import json,hashlib,zipfile,os
          from pathlib import Path
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          cat=json.loads(Path('resourcepacks/release/manifest.json').read_text())
          assert cat['tag']=='nova-arcadia-v200-final-3gb-assets'
          assert apk.stat().st_size>=3_000_000_000,'APK itself must exceed 3GB, no separate content'
          assert apk.stat().st_size<4_200_000_000,'APK ZIP32 overflow risk'
          count=0
          with zipfile.ZipFile(apk) as package:
            for p in cat['packs']:
              path='assets/na-game/'+p['file']
              entry=package.getinfo(path)
              assert entry.file_size==p['compressedBytes'],(path,entry.file_size)
              assert entry.compress_type==zipfile.ZIP_STORED,('Unexpected ZIP recompression',path)
              h=hashlib.sha256()
              with package.open(entry) as file:
                for part in iter(lambda:file.read(1024*1024),b''):h.update(part)
              assert h.hexdigest()==p['sha256'],path
              count+=1
          assert count==7
          report={'distribution':'ONE_SIGNED_APK_OFFLINE','apkBytes':apk.stat().st_size,
            'totalBytes':apk.stat().st_size,'goalBytes':3_000_000_000,
            'bundledOriginalZIPs':count,'originalArt':3808,
            'requiresInternetAfterDownload':False,'hasSeparateDLCs':False}
          Path('qa/na-rc18-single-apk-report.json').write_text(json.dumps(report,indent=2))
          print('RC18 SINGLE APK EMBEDDED CONTENT VERIFIED:',json.dumps(report))
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > qa/na-final-badging.txt
          grep -Fq "name='$NA_PACKAGE'" qa/na-final-badging.txt
          grep -Fq "versionCode='2000018'" qa/na-final-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > qa/na-final-certs.txt
          grep -Fq "CN=Nova Arcadia 2.0 Milestone QA" qa/na-final-certs.txt
      - name: Reclaim multi-gigabyte runner disk before offline Android testing
        run: |
          set -euo pipefail
          # All archives are now inside the signed APK.
          rm -rf resourcepacks/release/NA20-*.zip
          rm -rf android/app/src/main/assets/na-game
          rm -rf android/app/build/intermediates/merged_assets
          rm -rf dist node_modules public/assets/ambient-expanded public/assets/ambient
          rm -rf public/assets/soundscapes public/assets/music
          sync
          df -h .
      - name: Prepare signed and integrity-audited APK filename before runtime acceptance
        run: |
          set -euo pipefail
          mkdir -p qa
          ln -f android/app/build/outputs/apk/debug/app-debug.apk qa/NovaArcadia-2.0.0-RC18-APK-UNICO-3GB-QA201.apk
          sha256sum qa/NovaArcadia-2.0.0-RC18-APK-UNICO-3GB-QA201.apk > qa/rc18-apk-sha256.txt
          stat -c 'RC18 signed single APK: %n %s bytes' qa/*.apk >> "$GITHUB_STEP_SUMMARY"
      - name: Archive ONE signed APK (Android emulator test still follows)
        uses: actions/upload-artifact@v7
        with:
          name: NovaArcadia-2.0.0-RC18-APK-UNICO-3GB-QA201
          path: qa/NovaArcadia-2.0.0-RC18-APK-UNICO-3GB-QA201.apk
          retention-days: 30
          compression-level: 0
          archive: false
          if-no-files-found: error
      - name: Publish integrity report for one-file edition
        uses: actions/upload-artifact@v4
        with:
          name: NovaArcadia-RC18-relatorio-APK-unico
          path: |
            qa/na-rc18-single-apk-report.json
            qa/na-final-badging.txt
            qa/na-final-certs.txt
            qa/rc18-apk-sha256.txt
          retention-days: 30
          if-no-files-found: error
      - name: Emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install signed APK, automatically prepare all 7 districts OFFLINE and verify Android notification/status bars hidden
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          disk-size: 16384M
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -e
            timeout 420 adb install -r -t android/app/build/outputs/apk/debug/app-debug.apk
            # Prove that first launch starts mandatory preparation OFFLINE.
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell logcat -c
            adb shell am start -W -n "$NA_PACKAGE"/com.cyberpunk.tacticalrpg.MainActivity
            sleep 6
            NA_TEST_PACKAGE="$NA_PACKAGE" node scripts/test-android-single-apk-offline.mjs
            adb shell am force-stop "$NA_PACKAGE"
            adb shell am start -W -n "$NA_PACKAGE"/com.cyberpunk.tacticalrpg.MainActivity
            sleep 5
            NA_TEST_PACKAGE="$NA_PACKAGE" node scripts/test-android-webview-startup.mjs
            adb shell dumpsys package "$NA_PACKAGE" | grep -E 'versionCode|versionName' | head -n 6
      - name: Release notes — RC18 automatic complete game and native fullscreen, no opt-in
        if: always()
        run: |
          {
            echo "## Nova Arcádia 2.0 RC18: APK único com jogo integral"
            echo "O APK tem mais de 3.000.000.000 bytes e inclui os sete distritos obrigatórios. Não existe escolha ou conteúdo adicional."
            echo "No PRIMEIRO BOOT, os sete distritos são preparados AUTOMATICAMENTE sem clicar em instalar, sem rede. Android fullscreen oculta barras e reaplica após HOME/resume."
            echo "Arquivo: Artifacts > NovaArcadia-2.0.0-RC18-APK-UNICO-3GB-QA201. Se disponível, faça o download direto sem ZIP externo."
            echo "Não publicar em GitHub Releases, pois o limite por arquivo é 2 GiB."
            echo "Mantenha espaço livre suficiente para o APK e a expansão local."
          } >> "$GITHUB_STEP_SUMMARY"
